# Workflow Name
# Defines the name displayed in the GitHub Actions tab.
# No indentation is required for the workflow name.
name: Hello

# Workflow Trigger
# Defines when the workflow should execute.
# workflow_dispatch allows you to trigger the workflow manually
# from the GitHub Actions tab.
on:
  workflow_dispatch:

# Jobs
# Defines what the workflow should do.
# A workflow can contain one or more jobs.
# Each job runs independently unless a dependency is configured.
jobs:

  # Job 1: Say Hello
  say-hello:

    # Runner
    # GitHub creates a temporary (ephemeral) virtual machine
    # running Ubuntu to execute this job.
    runs-on: ubuntu-latest

    # Steps
    # Each job contains one or more steps.
    # Steps execute sequentially in the order they are defined.
    steps:

      # Step 1: Print a welcome message
      - name: Say hello to everyone
        run: echo "Hello Dosto"
