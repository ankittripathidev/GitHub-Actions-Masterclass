# What is the goal of your workflow.
# Goal: Whenever someone changes the python code.
# The linter will check if the syntax, format, indentation (Linting) is correct or not.

name: Auto Linter

on:
  push:
    paths: "*.py"


jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      # This will automatically clone the code of the current branch into the runner
      - name: Checkout/Clone the Code
        uses: actions/checkout@v7

      # This step will install python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # This step will Install the linting tool
      - name: Install Linter
        run: pip install ruff

      # This step will run the linter
      - name: Check all the files for linting
        run: ruff check .
